%YAML 1.1
---
name: GripperStateRunner
spec_type: provider
spec_version: 1.2
description: "The provider for reading the current gripper articulation state from joint_states."
implements: gripper_capabilities/GripperStateRunner
runner: capabilities2_runner::GripperStateRunner

definition:
  command: "<Runner interface=gripper_capabilities/GripperStateRunner provider=gripper_capabilities/GripperStateRunner joint_names_csv='$joint_names_csv' timeout_sec='$timeout_sec' />"
  configuration_parameters:
    - name: joint_names_csv
      type: string
      optional: true
      default: ""
      semantic_key: gripper.state.names
      description: "Optional comma-separated ordered gripper joint names to read. When omitted, all joints from the latest message are returned."
    - name: timeout_sec
      type: double
      optional: true
      default: 2.0
      semantic_key: gripper.state.timeout
      description: "Maximum time in seconds to wait for a joint-state message."
  runtime_parameters:
    output:
      - name: joint_names_csv
        type: string
        semantic_key: gripper.state.names
        description: "Comma-separated ordered joint names returned from the latest gripper state sample."
      - name: joint_positions_csv
        type: string
        semantic_key: gripper.state.positions
        description: "Comma-separated ordered joint positions matching joint_names_csv."
      - name: joint_count
        type: int
        semantic_key: gripper.state.count
        description: "Number of joints returned in the current gripper state sample."