%YAML 1.1
---
name: GripperStateRunner
spec_version: 1.2
spec_type: interface
description: "This capability reads the current gripper articulation state from joint_states and returns the selected joints as comma-separated lists."
interface:
  topics:
    "/joint_states":
      type: "sensor_msgs::msg::JointState"
      description: "Joint-state stream used to read the current gripper articulation"